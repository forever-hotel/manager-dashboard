name: DDP quality gates
on:
  push:
  pull_request:
    branches: [develop, main]
permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: mad
          RABBITMQ_DEFAULT_PASS: integration-only
          RABBITMQ_DEFAULT_VHOST: mad_test
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: mad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d mad_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:integration-only@localhost:5432/mad_test
      TEST_RABBITMQ_URL: amqp://mad:integration-only@localhost:5672/mad_test
      COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: node ../scripts/verify-quality-gates.mjs
      - run: npm run build
      - run: node --test ../scripts/check-changed-coverage.test.mjs
      - run: npm run test:cov -- --runInBand
      - run: node ../scripts/check-changed-coverage.mjs backend
      - run: npm run test:integration
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      BACKEND_API_URL: http://localhost:4000
      APP_ORIGIN: http://localhost:3000
      COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node scripts/verify-build-config.mjs
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-build-config.mjs
      - run: node --test scripts/verify-build-config.test.mjs scripts/audit-ci.test.mjs
      - run: npm run lint
      - run: npm run format:check
      - run: node ../scripts/verify-quality-gates.mjs
      - run: npm run test:cov
      - run: node ../scripts/check-changed-coverage.mjs frontend
      - run: npm run build
      - run: npm run audit:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage

  browser:
    name: Browser acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: mad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d mad_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:integration-only@localhost:5432/mad_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: node scripts/verify-build-config.mjs
        working-directory: frontend
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: node scripts/verify-build-config.mjs
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: frontend/test-results

  containers:
    name: Container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example -f docker-compose.yml -f deploy/compose.ci.yml -p mad-ci config --quiet
      - run: docker compose --env-file .env.example -f docker-compose.yml -f deploy/compose.ci.yml -p mad-ci up --build --wait --wait-timeout 180 postgres mad-backend mad-frontend
      - run: |
          curl --fail http://localhost:4000/health/ready
          curl --fail http://localhost:3000/api/health
          curl --fail http://localhost:3000/login
      - run: docker compose --env-file .env.example -f docker-compose.yml -f deploy/compose.ci.yml -p mad-ci down --volumes
        if: always()

  deployment-tools:
    name: Deployment tool checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s deploy -p 'test_staging_*.py'
      - run: python -m unittest discover -s deploy -p 'test_operations_*.py'

  publish-staging:
    name: Publish checked staging images
    needs: [backend, frontend, browser, containers, deployment-tools]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.names.outputs.backend }}@${{ steps.backend.outputs.digest }}
      frontend: ${{ steps.names.outputs.frontend }}@${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate public build configuration and image names
        id: names
        env:
          PUBLIC_API: ${{ vars.STAGING_PUBLIC_API_ORIGIN }}
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.parse
          value = urllib.parse.urlsplit(os.environ['PUBLIC_API'])
          assert value.scheme == 'https' and value.hostname and not value.username and not value.password
          assert value.path in ('', '/') and not value.query and not value.fragment
          PY
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "backend=${image}/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${image}/frontend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: backend
        with:
          context: ./backend
          push: true
          tags: ${{ steps.names.outputs.backend }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v6
        id: frontend
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.names.outputs.frontend }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: NEXT_PUBLIC_API_URL=${{ vars.STAGING_PUBLIC_API_ORIGIN }}

  deploy-staging:
    name: Deploy and verify staging
    timeout-minutes: 30
    needs: publish-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, linux, x64, mad-staging]
    environment: staging
    concurrency:
      group: mad-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      MAD_STAGING_STATE_DIR: ${{ vars.STAGING_STATE_DIR }}
      MAD_STAGING_CONFIG_DIR: ${{ vars.STAGING_CONFIG_DIR }}
      MAD_STAGING_ORIGIN: ${{ vars.STAGING_APP_ORIGIN }}
      MAD_STAGING_API_ORIGIN: ${{ vars.STAGING_PUBLIC_API_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject superseded develop revision
        shell: bash
        run: |
          current="$(git ls-remote origin refs/heads/develop | cut -f1)"
          test "$current" = "$GITHUB_SHA"
      - name: Configure private Docker credentials directory
        shell: bash
        run: |
          umask 077
          docker_config="$RUNNER_TEMP/mad-staging-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$docker_config"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy immutable images and verify login/API
        env:
          BACKEND_IMAGE: ${{ needs.publish-staging.outputs.backend }}
          FRONTEND_IMAGE: ${{ needs.publish-staging.outputs.frontend }}
        shell: bash
        run: python3 deploy/staging_deploy.py --sha "$GITHUB_SHA" --backend "$BACKEND_IMAGE" --frontend "$FRONTEND_IMAGE"
      - name: Preserve sanitized deployment outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-${{ github.sha }}-${{ github.run_attempt }}
          path: deployment-result.json
          if-no-files-found: warn
      - name: Add sanitized deployment summary
        if: always()
        shell: bash
        run: |
          if test -f deployment-result.json; then
            printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat deployment-result.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Deployment did not reach the deployment tool. Inspect the failed preflight/job step.' >> "$GITHUB_STEP_SUMMARY"
          fi
