name: DDP quality gates
on:
  push:
  pull_request:
    branches: [development, develop, main]
permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: mad
          RABBITMQ_DEFAULT_PASS: integration-only
          RABBITMQ_DEFAULT_VHOST: mad_test
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: mad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d mad_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      SHARED_WEBSOCKET_PATH: ${{ github.workspace }}/websocket
      TEST_DATABASE_URL: postgresql://postgres:integration-only@localhost:5432/mad_test
      TEST_RABBITMQ_URL: amqp://mad:integration-only@localhost:5672/mad_test
      COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: forever-hotel/websocket-service
          ref: ${{ vars.WEBSOCKET_TEST_REF || 'development' }}
          path: websocket
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: websocket
      - run: npm run build
        working-directory: websocket
      - run: npm run lint
      - run: npm run format:check
      - run: node ../scripts/verify-quality-gates.mjs
      - run: npm run build
      - run: node --test ../scripts/check-changed-coverage.test.mjs
      - run: npm run test:cov -- --runInBand
      - run: node ../scripts/check-changed-coverage.mjs backend
      - run: npm run test:integration
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      BACKEND_API_URL: http://localhost:4000
      APP_ORIGIN: http://localhost:3000
      COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node scripts/verify-build-config.mjs
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-build-config.mjs
      - run: node --test scripts/verify-build-config.test.mjs scripts/audit-ci.test.mjs
      - run: npm run lint
      - run: npm run format:check
      - run: node ../scripts/verify-quality-gates.mjs
      - run: npm run test:cov
      - run: node ../scripts/check-changed-coverage.mjs frontend
      - run: npm run build
      - run: npm run audit:ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-failure-traces
          path: frontend/test-results/
          if-no-files-found: ignore

  cross-system:
    name: Central auth and shared WebSocket integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: mad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d mad_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: mad
          RABBITMQ_DEFAULT_PASS: integration-only
          RABBITMQ_DEFAULT_VHOST: mad_test
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      SHARED_WEBSOCKET_PATH: ${{ github.workspace }}/websocket
      TEST_DATABASE_URL: postgresql://postgres:integration-only@localhost:5432/mad_test
      TEST_RABBITMQ_URL: amqp://mad:integration-only@localhost:5672/mad_test
      MAD_BACKEND_PATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: forever-hotel/api-gateway
          ref: ${{ vars.GATEWAY_TEST_REF || 'develop' }}
          path: api-gateway
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: forever-hotel/websocket-service
          ref: ${{ vars.WEBSOCKET_TEST_REF || 'development' }}
          path: websocket
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
        working-directory: websocket
      - run: npm run build
        working-directory: websocket
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm ci --ignore-scripts
        working-directory: api-gateway
      - run: npm run test:system
        working-directory: api-gateway

  publish-images:
    name: Publish reviewed Manager Dashboard images
    needs: [backend, frontend, cross-system]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      packages: write
    concurrency:
      group: mad-image-publication-development
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require peer approval on the merged PR's final code
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: context.sha, per_page: 100
            });
            const candidates = prs.filter(pr => pr.merged_at && pr.base.ref === 'development' && pr.merge_commit_sha === context.sha);
            for (const pr of candidates) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number, per_page: 100 });
              const latest = new Map();
              for (const review of reviews) {
                if (review.user && ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) latest.set(review.user.login, review);
              }
              const decisions = [...latest.values()];
              const approved = decisions.some(r => r.state === 'APPROVED' && r.commit_id === pr.head.sha && r.user.login !== pr.user.login);
              if (approved && !decisions.some(r => r.state === 'CHANGES_REQUESTED')) return;
            }
            throw new Error('Image publication requires a merged PR into development with peer approval on its final head commit.');
      - name: Prepare temporary registry credentials and builder
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/mad-ghcr-auth"
          install -d -m 700 "$DOCKER_CONFIG"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --name mad-release --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Build and publish commit-tagged images
        env:
          PUBLIC_API_ORIGIN: https://forever-hotel-manager.duckdns.org
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          for component in backend frontend; do
            image="ghcr.io/$repository/$component"
            args=()
            if [[ "$component" == frontend ]]; then
              args+=(--build-arg "NEXT_PUBLIC_API_URL=$PUBLIC_API_ORIGIN")
            fi
            docker buildx build --platform linux/amd64 --push \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$image:$GITHUB_SHA" \
              --metadata-file "$RUNNER_TEMP/mad-$component.json" \
              "${args[@]}" "$component"
            digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/mad-$component.json")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s=%s@%s\n' "$component" "$image" "$digest" >> "$RUNNER_TEMP/mad-images.txt"
          done
          jq -n --arg commit "$GITHUB_SHA" \
            --arg frontend "$(sed -n 's/^frontend=//p' "$RUNNER_TEMP/mad-images.txt")" \
            --arg backend "$(sed -n 's/^backend=//p' "$RUNNER_TEMP/mad-images.txt")" \
            '{commit: $commit, frontend: $frontend, backend: $backend}' > release-images.json
          {
            echo '### Published Manager Dashboard images'
            echo '```json'
            cat release-images.json
            echo '```'
            echo 'Staging deployment follows when enabled and release checks pass.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manager-dashboard-release-images
          path: release-images.json
          if-no-files-found: error
          overwrite: true
      - name: Remove registry login
        if: always()
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/mad-ghcr-auth"
          docker logout ghcr.io || true

  deploy-staging:
    name: Deploy manager-dashboard to staging
    needs: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && vars.SERVICE_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
      actions: read
      pull-requests: read
    concurrency:
      group: mad-staging-release
      cancel-in-progress: false
    steps:
      - name: Deploy this run's reviewed immutable images
        uses: forever-hotel/infra/.github/actions/deploy-service@e1f320d8c3b7622339291f70c1acd3b7458df439
        with:
          service: mad
          artifact: manager-dashboard-release-images
          host: ${{ vars.STAGING_HOST }}
          user: ${{ vars.STAGING_USER }}
          ssh-key: ${{ secrets.STAGING_SSH_KEY }}
          known-hosts: ${{ secrets.STAGING_KNOWN_HOSTS }}
      - name: Retain service deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mad-staging-receipt
          path: ${{ runner.temp }}/service-release/receipt.json
          if-no-files-found: warn
          overwrite: true
