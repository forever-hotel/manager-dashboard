name: Reviewed MAD release promotion
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed main release tag matching deploy/release/candidate.json
        required: true
        type: string
      target:
        description: Production-like rehearsal or explicitly approved production
        required: true
        type: choice
        options: [rehearsal, production]
        default: rehearsal
      simulate_failure:
        description: Inject failure after traffic switch (rehearsal only)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - name: Require main and explicitly enabled target
        env:
          TARGET: ${{ inputs.target }}
          PRODUCTION_ENABLED: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
          REHEARSAL_ENABLED: ${{ vars.RELEASE_REHEARSAL_ENABLED }}
          SIMULATE: ${{ inputs.simulate_failure }}
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          if test "$TARGET" = production; then
            test "$PRODUCTION_ENABLED" = true
            test "$SIMULATE" != true
          else
            test "$TARGET" = rehearsal
            test "$REHEARSAL_ENABLED" = true
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify final main CI and release package
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=${GITHUB_SHA}&status=success&per_page=10" > "$RUNNER_TEMP/main-ci.json"
          python deploy/release_package.py --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --main-ci "$RUNNER_TEMP/main-ci.json"
      - name: Fetch staging run identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.package.outputs.run_id }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > "$RUNNER_TEMP/staging-run.json"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.package.outputs.run_id }}
          name: ${{ steps.package.outputs.artifact }}
          path: accepted-staging
      - name: Match accepted digests and successful trusted staging run
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: python deploy/release_package.py --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --staging-result accepted-staging/deployment-result.json --run-metadata "$RUNNER_TEMP/staging-run.json"

  promote:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      ((inputs.target == 'production' && vars.PRODUCTION_RELEASE_ENABLED == 'true') ||
       (inputs.target == 'rehearsal' && vars.RELEASE_REHEARSAL_ENABLED == 'true'))
    runs-on:
      [
        self-hosted,
        linux,
        x64,
        "${{ inputs.target == 'production' && 'mad-production' || 'mad-release-rehearsal' }}",
      ]
    environment: ${{ inputs.target == 'production' && 'production' || 'release-rehearsal' }}
    timeout-minutes: 20
    concurrency:
      group: mad-release-${{ inputs.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      MAD_RELEASE_CONFIG_DIR: ${{ vars.RELEASE_CONFIG_DIR }}
      MAD_RELEASE_STATE_DIR: ${{ vars.RELEASE_STATE_DIR }}
      MAD_RELEASE_HOOKS_DIR: ${{ vars.RELEASE_HOOKS_DIR }}
      DOCKER_CONFIG: ${{ runner.temp }}/mad-release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject superseded main release
        shell: bash
        run: |
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$current" = "$GITHUB_SHA"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run approved host handoff and verification
        env:
          TARGET: ${{ inputs.target }}
          SIMULATE: ${{ inputs.simulate_failure }}
        shell: bash
        run: |
          args=(--target "$TARGET")
          if test "$SIMULATE" = true; then args+=(--simulate-failure); fi
          python3 deploy/release_promote.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: release-result.json
          if-no-files-found: warn
      - name: Report sanitized outcome
        if: always()
        shell: bash
        run: |
          if test -f release-result.json; then
            printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat release-result.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Release stopped before a handoff result was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
