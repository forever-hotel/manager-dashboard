# Ubuntu/Debian host template. Owner installs under /etc/rsyslog.d/.
# Restrict the input to loopback; Docker's logging driver runs on the host.
module(load="imtcp")
template(name="MadMessageOnly" type="string" string="%msg%\n")
ruleset(name="mad-private") {
  if ($programname == "mad-backend" or $programname == "mad-monitor") then {
    action(type="omfile" file="/var/log/mad/operations.log"
      fileOwner="syslog" fileGroup="syslog" fileCreateMode="0600"
      dirCreateMode="0700" template="MadMessageOnly")
    stop
  }
}
input(type="imtcp" address="127.0.0.1" port="1514" ruleset="mad-private")
