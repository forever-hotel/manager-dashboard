# Daily rotation only. 400 retained daily archives exceed twelve calendar months.
# Do not add size-triggered rotation or force multiple rotations per day.
/var/log/mad/operations.log {
    daily
    rotate 400
    missingok
    notifempty
    compress
    delaycompress
    dateext
    create 0600 syslog syslog
    sharedscripts
    postrotate
        /usr/bin/systemctl kill -s HUP rsyslog.service >/dev/null 2>&1 || true
    endscript
}
