# Local development stack. The gateway source folder is supplied separately.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: forever_hotel
      MAD_DB_PASSWORD: ${MAD_DB_PASSWORD:?Set MAD_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/01-runtime-role.sh:/docker-entrypoint-initdb.d/01-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forever_hotel"]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    build: ./backend
    command: ["node", "dist/database/migrate-cli.js"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/forever_hotel
      MAD_DB_ROLE: mad_app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mad-backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://mad_app:${MAD_DB_PASSWORD}@postgres:5432/forever_hotel
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 6
    restart: unless-stopped

  api-gateway:
    build: ${API_GATEWAY_CONTEXT:-./api-gateway}
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8080
      MAD_SERVICE_URL: http://mad-backend:4000
      ALLOWED_ORIGINS: ${APP_ORIGIN:-http://localhost:3000}
      ROUTES_FILE: config/routes.local.json
    volumes:
      - ./deploy/gateway.routes.local.json:/app/config/routes.local.json:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      mad-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    init: true
    restart: unless-stopped

  mad-frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    environment:
      BACKEND_API_URL: http://api-gateway:8080
      BACKEND_API_MODE: gateway
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    # Start independently so the login page can explain a backend/database outage.
    # Readiness requires the gateway to reach the migrated MAD backend.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 6
    restart: unless-stopped

volumes:
  postgres_data:
