# =============================================================================
# Forever Hotel - Manager Dashboard (MAD) Docker Compose
# SDS Section 1.2.1 – Container Deployment Model
# MAD-003: Docker Compose Configuration
# =============================================================================

services:
  # MAD Backend (NestJS)
  mad-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mad-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      - PORT=4000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/forever_hotel}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-15m}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-7d}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mad-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # MAD Frontend (Next.js)
  mad-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: mad-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      mad-backend:
        condition: service_healthy
    networks:
      - mad-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: forever_hotel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mad-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forever_hotel"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  mad-network:
    driver: bridge

volumes:
  postgres_data:
