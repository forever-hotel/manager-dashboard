# Local application containers; PostgreSQL is hosted on Neon. No schema changes run at startup.
services:
  mad-rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: mad
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-mad-local-only}
    volumes:
      - mad-rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  mad-backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 4000
      MAD_REALTIME_ENABLED: "true"
      MAD_PROMOTIONS_PUBLISH_ENABLED: ${MAD_PROMOTIONS_PUBLISH_ENABLED:-false}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://mad:mad-local-only@mad-rabbitmq:5672}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DB_HOST: ${DB_HOST:?Set DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_SSL: "true"
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: ${DB_LOGGING:-false}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER}
      LOW_BOOKING_THRESHOLD: ${LOW_BOOKING_THRESHOLD-0.40}
      STAFF_CREDENTIALS_KEY: ${STAFF_CREDENTIALS_KEY:-}
      STAFF_EMAIL_ENABLED: ${STAFF_EMAIL_ENABLED:-false}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      INITIAL_MANAGER_EMAIL: ${INITIAL_MANAGER_EMAIL:-}
      INITIAL_MANAGER_USERNAME: ${INITIAL_MANAGER_USERNAME:-}
      INITIAL_MANAGER_PASSWORD: ${INITIAL_MANAGER_PASSWORD:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 6
    restart: unless-stopped

  api-gateway:
    build: ${API_GATEWAY_CONTEXT:-./api-gateway}
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8080
      MAD_SERVICE_URL: http://mad-backend:4000
      ALLOWED_ORIGINS: ${APP_ORIGIN:-http://localhost:3000}
      ROUTES_FILE: config/routes.local.json
    configs:
      - source: gateway_routes
        target: /app/config/routes.local.json
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      mad-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    init: true
    restart: unless-stopped

  mad-frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    environment:
      BACKEND_API_URL: http://api-gateway:8080
      BACKEND_API_MODE: gateway
      MAD_SOCKET_PUBLIC_URL: ${MAD_SOCKET_PUBLIC_URL:-http://localhost:4000}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    # Start independently so the login page can explain a backend/database outage.
    # Readiness requires the gateway to reach the hosted MAD database through the backend.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 6
    restart: unless-stopped

volumes:
  mad-rabbitmq-data:

configs:
  gateway_routes:
    content: |
      [
        {
          "id": "mad-auth",
          "enabled": true,
          "prefix": "/mad/auth",
          "rewritePrefix": "/auth",
          "upstreamEnv": "MAD_SERVICE_URL",
          "cookieNames": [
            "mad_session",
            "mad_csrf"
          ]
        },
        {
          "id": "mad",
          "enabled": true,
          "prefix": "/mad",
          "rewritePrefix": "/mad",
          "upstreamEnv": "MAD_SERVICE_URL",
          "cookieNames": [
            "mad_session",
            "mad_csrf"
          ]
        }
      ]
