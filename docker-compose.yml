services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: forever_hotel
      MAD_DB_PASSWORD: ${MAD_DB_PASSWORD:?Set MAD_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/01-runtime-role.sh:/docker-entrypoint-initdb.d/01-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forever_hotel"]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    build: ./backend
    command: ["node", "dist/database/migrate-cli.js"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/forever_hotel
      MAD_DB_ROLE: mad_app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mad-backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://mad_app:${MAD_DB_PASSWORD}@postgres:5432/forever_hotel
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:?Set AUTH_SERVICE_URL}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 6
    restart: unless-stopped

  mad-frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    environment:
      BACKEND_API_URL: http://mad-backend:4000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    # Start independently so the login page can explain a backend/database outage.
    # Its readiness check still fails until the backend database is ready.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 6
    restart: unless-stopped

volumes:
  postgres_data:
